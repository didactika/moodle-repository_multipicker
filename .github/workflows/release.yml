name: Publish a reviewed release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate the maintenance line and release metadata
        id: package
        run: |
          python3 - <<'PY'
          import ast, datetime, os, pathlib, re
          source = pathlib.Path('version.php').read_text()
          def value(field):
              match = re.search(re.escape('$plugin->' + field) + r'\s*=\s*([^;]+);', source)
              if not match:
                  raise SystemExit('Missing plugin metadata: ' + field)
              return match.group(1).strip()
          branch = os.environ['GITHUB_REF_NAME']
          expected = {'MOODLE_400_STABLE': ([400, 502], '4.0.'), 'main': ([503, 503], '5.3.')}
          if branch not in expected:
              raise SystemExit('Publish only from a reviewed maintenance branch.')
          supported, prefix = expected[branch]
          release = ast.literal_eval(value('release'))
          component = ast.literal_eval(value('component'))
          version = ast.literal_eval(value('version'))
          if ast.literal_eval(value('supported')) != supported:
              raise SystemExit('Supported versions do not match the maintenance branch.')
          if not release.startswith(prefix) or not re.fullmatch(r'\d+\.\d+\.\d+', release):
              raise SystemExit('Release must follow the maintenance line and semantic version format.')
          if value('maturity') != 'MATURITY_STABLE':
              raise SystemExit('Stable release metadata is required.')
          if not re.fullmatch(r'\d{10}\.400', version):
              raise SystemExit('Version must use YYYYMMDDXX.400 on this maintenance line.')
          datetime.datetime.strptime(version[:8], '%Y%m%d')
          if not re.fullmatch(r'(local|repository)_[a-z][a-z0-9]*', component):
              raise SystemExit('Invalid plugin component.')
          heading = '## [' + release + ']'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = next((i for i, line in enumerate(changelog.splitlines()) if line.startswith(heading)), None)
          if section is None:
              raise SystemExit('The changelog needs notes for the declared release.')
          notes = []
          for line in changelog.splitlines()[section + 1:]:
              if line.startswith('## '): break
              notes.append(line)
          if not ''.join(notes).strip(): raise SystemExit('Empty release notes.')
          pathlib.Path('release_notes.md').write_text('\n'.join(notes).strip() + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, data in {'release': release, 'tag': 'v' + release, 'component': component,
                                'shortname': component.split('_', 1)[1], 'version': version,
                                'latest': str(branch == 'main').lower()}.items():
                  output.write(key + '=' + data + '\n')
          PY

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | (.status + ":" + .conclusion)')
          test "$result" = 'completed:success' || { echo 'Run and pass CI for this commit before publishing.'; exit 1; }

      - name: Build the Moodle plugin archive
        env:
          COMPONENT: ${{ steps.package.outputs.component }}
          SHORTNAME: ${{ steps.package.outputs.shortname }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          git archive --format=zip --prefix="$SHORTNAME/" --output="$COMPONENT-$TAG-$VERSION.zip" "$GITHUB_SHA"

      - name: Publish the reviewed archive
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ steps.package.outputs.component }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          LATEST: ${{ steps.package.outputs.latest }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || { echo 'This release tag belongs to another commit.'; exit 1; }
          fi
          exists=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'any(.[]; .tag_name == env.TAG)')
          if [ "$exists" = true ]; then
            echo "Release $TAG already exists; no changes made."
            exit 0
          fi
          gh release create "$TAG" "$COMPONENT-$TAG-$VERSION.zip" --target "$GITHUB_SHA" --title "$TAG" --notes-file release_notes.md --latest="$LATEST"
